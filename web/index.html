<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Google Flow watermark remover</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: dark; --bg: #14161a; --card: #1d2026; --line: #2c313a; --fg: #e6e8eb; --dim: #8a919c; --ok: #4ade80; --warn: #fbbf24; --accent: #60a5fa; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--fg); }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .dim { color: var(--dim); }
  #drop { display: block; margin: 16px 0; border: 2px dashed var(--line); border-radius: 12px; padding: 32px; text-align: center; cursor: pointer; }
  #drop.over { border-color: var(--accent); background: #1a2330; }
  .options { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin: 16px 0; }
  .head { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  .name { font-weight: 600; word-break: break-all; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: #333; }
  .badge.removed { background: #14532d; color: var(--ok); }
  .badge.unchanged { background: #422006; color: var(--warn); }
  .stats { font-family: ui-monospace, monospace; font-size: 12px; color: var(--dim); margin: 6px 0 12px; }
  .compare { position: relative; overflow: hidden; border-radius: 8px; background: #000; user-select: none; touch-action: none; cursor: ew-resize; }
  .compare img { display: block; width: 100%; height: auto; pointer-events: none; }
  .compare .after { position: absolute; inset: 0; clip-path: inset(0 0 0 50%); }
  .compare .bar { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; background: #fff; box-shadow: 0 0 4px #000; pointer-events: none; }
  .compare .label { position: absolute; top: 8px; padding: 2px 8px; border-radius: 6px; background: #000a; font-size: 12px; pointer-events: none; }
  .compare .label.left { left: 8px; }
  .compare .label.right { right: 8px; }
  .preview { width: 100%; border-radius: 8px; display: block; }
  .zoom { display: flex; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
  .zoom figure { margin: 0; }
  .zoom canvas { width: 280px; height: 280px; border-radius: 8px; border: 1px solid var(--line); image-rendering: pixelated; }
  .zoom figcaption { font-size: 12px; color: var(--dim); text-align: center; }
  a.download { display: inline-block; margin-top: 12px; padding: 6px 14px; border-radius: 8px; background: var(--accent); color: #0b1220; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Remove the ✦ mark from Google Flow images</h1>
  <div class="dim">Runs entirely in your browser (Go compiled to WebAssembly); images never leave your device. <span id="status">Loading…</span></div>

  <label id="drop">
    <input id="file" type="file" accept="image/jpeg,image/png" multiple hidden>
    Drop JPEG or PNG images here, or click to choose
  </label>

  <div class="options">
    <label><input type="radio" name="threshold" value="default" checked> Any image (threshold <span id="threshold-default">0.2</span>)</label>
    <label><input type="radio" name="threshold" value="flow"> Known to come from Flow (threshold <span id="threshold-flow">0.1</span>)</label>
  </div>

  <div id="results"></div>
</main>
<script src="app.js"></script>
</body>
</html>
